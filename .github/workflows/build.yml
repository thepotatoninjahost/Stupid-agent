name: Build Vorv APK

on:
  push:
    # I-2 (code review, 2026-11): dependabot/** added — dependabot pushes
    # branches named "dependabot/gradle/…" in THIS repo, which matched
    # neither feature/** nor fix/**: every dependency-bump PR used to get
    # ZERO CI (no tests, no compile) before being mergeable.
    branches: [main, 'feature/**', 'fix/**', 'dependabot/**']
  # I-2: pull requests targeting main now run the FULL test + compile gate.
  # Fork PRs used to get nothing at all (their branches live in the fork,
  # where this workflow doesn't exist); same-repo PRs only got push CI by
  # accident of branch naming. PR runs are read-token-safe: keystore
  # decode is skipped (secrets never reach fork PRs → HAS_KEYSTORE=false),
  # and the artifact deletion/upload/rolling-release steps are gated to
  # push events below — a read-only fork token can never be asked to write.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same ref are cancelled (no wasted minutes, no
# release-tag races between rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Whether a release keystore is configured as a repo secret. Computed once;
  # jobs compare env.HAS_KEYSTORE so steps can degrade gracefully on forks.
  HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

# Runner note: pinned to ubuntu-26.04 instead of ubuntu-latest. The -latest
# label is mid-migration to 26.04 (runs land on either 24.04 or 26.04, each
# switch emitting a "label will migrate" notice). Pinning keeps the image
# deterministic and the annotation list quiet.
jobs:
  # ------------------------------------------------------------------ test
  test:
    name: Unit tests + sandbox self-test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        # actions/setup-java v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      # No gradle/actions/setup-gradle step, deliberately:
      #
      # 1. Gradle itself comes from the wrapper (./gradlew), whose
      #    gradle-wrapper.properties pins the exact 8.9 distribution AND its
      #    SHA-256. Nothing needs to provision a second Gradle.
      #
      # 2. setup-gradle's User-Home caching was the source of 22 of the 28
      #    warnings on the 2026-11-04/05 runs: the Actions cache service
      #    rejected every save/restore ("Our services aren't available right
      #    now" / "Cache service responded with 400"), one warning per cache
      #    entry per job. With the service failing for this repo, caching
      #    bought nothing while the runs already paid full download cost.
      #
      # 3. From gradle/actions v6 the caching component is closed-source and
      #    proprietary (Gradle Terms of Use, guaranteed free only for public
      #    repositories; the repo was private when this was written, and is
      #    public as of 2026-11-06 — "for now", per the owner, so this may
      #    flip back). Re-enabling caching while private would mean accepting
      #    those terms on the repo owner's behalf — still not a decision CI
      #    gets to make silently.
      #
      # Trade-off: each run re-downloads Gradle + dependencies (~1-2 min per
      # job, measured on the 2026-11-05 runs where caching was already dead).
      # Re-enable only with an explicit, conscious choice about items 2/3.

      - name: Python sandbox self-test
        run: python3 app/src/main/python/test_vorv_sandbox.py

      - name: Unit tests (JUnit + Robolectric)
        run: ./gradlew test --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

  # ------------------------------------------------------------------ build
  build:
    name: Build debug + release APKs
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # rolling CI release (below): release assets live outside
                        # the Actions-storage quota, so the installable APKs stay
                        # downloadable even when the artifact quota is exhausted
      actions: write    # delete this repo's artifacts from previous runs (below)
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        # actions/setup-java v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      # No setup-gradle — see the note in the test job.

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build APKs (debug always; release signed when keystore present)
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # --- Actions-storage quota hygiene -----------------------------------
      #
      # Free accounts get 500 MB of artifact storage SHARED across every
      # private repo on the account. Each run here produces ~229 MB
      # (125 MB debug + 103 MB release), so without the two measures below
      # the quota filled and the upload step started failing on 2026-11-06
      # ("Artifact storage quota has been hit") while the BUILD itself had
      # succeeded. The two measures, both applied every run:
      #
      # Visibility note (2026-11-06): the repo is public "for now" (owner's
      # words), which removes the quota entirely — public-repo artifacts
      # are free and unlimited. Both measures STAY anyway:
      #   - "for now" means visibility may flip back to private, where the
      #     quota applies again with no warning;
      #   - the cleanup step also keeps the artifacts page at exactly one
      #   run's worth, private or not.
      #
      # 1. The step directly below deletes this repo's artifacts from
      #    PREVIOUS runs before the new ones are uploaded. Retention-days
      #    alone cannot do this job — it only ages artifacts out after days,
      #    while two runs back-to-back are already ~458 MB.
      #
      # 2. The installable APKs are ALSO attached to a rolling GitHub
      #    Release ("ci-latest", step after the uploads). Release assets do
      #    not consume the Actions-storage quota at all, so the user-facing
      #    delivery channel works even in the worst case where the shared
      #    quota is exhausted by other repos on the account.
      #
      # Both artifacts remain real artifacts (7-day retention kept for CI
      # consumers); nothing was removed.
      - name: Delete this repo's artifacts from previous runs
        # I-2: push runs only — on pull_request runs (especially from
        # forks) the token is read-only and deletion is neither possible
        # nor needed; PR runs upload no artifacts to begin with.
        if: github.event_name == 'push'
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts" \
            -q '.artifacts[] | select(.expired == false) | .id' \
          | while read -r id; do
              if [ -n "$id" ]; then
                echo "deleting stale artifact $id"
                gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
              fi
            done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # continue-on-error, not a silent swallow: an upload that fails because
      # the ACCOUNT-WIDE shared quota is exhausted (other repos, out of this
      # repo's control) must not paint a healthy build red — but the failure
      # is still flagged as a warning annotation, and the run's real gate is
      # the release-verification step below: if the APKs did not land on the
      # rolling release, the run goes red. A broken build can never hide.
      - name: Upload debug APK artifact
        continue-on-error: true
        # I-2: artifacts are a push-run deliverable; pull_request runs gate
        # on tests + compile and upload nothing (no quota, no fork-token
        # writes).
        if: github.event_name == 'push'
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Vorv-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release APK artifact
        continue-on-error: true
        if: github.event_name == 'push'
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Vorv-release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload signed release APK artifact
        if: github.event_name == 'push' && env.HAS_KEYSTORE == 'true'
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Vorv-release-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      # --- Rolling CI release (main only) ----------------------------------
      #
      # H-7 discipline: the signed Release published by the `publish` job is
      # the production installable, and it stays gated on the release
      # keystore — a debuggable build must never be presented as the release.
      # This step is a DIFFERENT thing, labelled honestly as what it is: a
      # rolling prerelease of the CI output so the APKs remain installable /
      # signable locally even when the artifact quota is exhausted. Both
      # files carry their true names and the notes say exactly what each is
      # (debug = debuggable, test sideload only; release = unsigned, needs
      # apksigner before install). Replaced on every main push.
      - name: Publish rolling CI release (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$DEBUG_APK" || { echo "debug APK missing"; exit 1; }
          test -f "$RELEASE_APK" || { echo "release APK missing"; exit 1; }
          # Replace the rolling release wholesale so stale assets can never
          # linger next to newer ones.
          gh release delete ci-latest --yes --cleanup-tag || true
          # Quoted heredoc: backticks stay literal; the SHA goes in via
          # placeholder substitution so no expansion happens inside the block.
          NOTES=$(cat <<'EOF'
          Automated CI output of commit __SHA__ — NOT a signed release.

          - `app-debug.apk`: debug-signed, debuggable. Sideloadable for testing (Settings → Apps → Special access → Install unknown apps → allow the browser, then tap the APK).
          - `app-release-unsigned.apk`: UNSIGNED. It will not install until signed: apksigner sign --ks <keystore> --out vorv-release.apk app-release-unsigned.apk.

          A proper signed release is published by the publish job when the RELEASE_KEYSTORE_* secrets are configured.
          EOF
          )
          NOTES=${NOTES/__SHA__/$SHORT_SHA}
          gh release create ci-latest "$DEBUG_APK" "$RELEASE_APK" \
            --prerelease \
            --title "Vorv CI build $SHORT_SHA (debug + unsigned release)" \
            --notes "$NOTES"
          # The real gate: both APKs must be on the release. If not, red run.
          for f in "$(basename "$DEBUG_APK")" "$(basename "$RELEASE_APK")"; do
            gh release view ci-latest --json assets \
              -q ".assets[].name" | grep -Fx "$f" \
              || { echo "MISSING on ci-latest release: $f"; exit 1; }
          done
          echo "rolling ci-latest release verified: both APKs present"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # ---------------------------------------------------------------- publish
  # Publish a Release only on main, and only when a release keystore is
  # configured — a debuggable debug build must never be the installable
  # artifact (audit finding H-7). Feature branches build + test only.
  publish:
    name: Publish signed release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout (for the short SHA)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check release keystore is configured
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::RELEASE_KEYSTORE_* secrets are not configured — skipping the GitHub Release. The CI-built debug APK remains available as a workflow artifact, but it is NOT an installable release build."

      - name: Download signed release APK
        if: env.HAS_KEYSTORE == 'true'
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Vorv-release-signed-APK
          path: release/

      - name: Compute short SHA and app version
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # Audit L-3: derive the release tag from the ACTUAL versionName in
          # app/build.gradle.kts instead of a hardcoded stale version.
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Publish Release
        if: env.HAS_KEYSTORE == 'true'
        # softprops/action-gh-release v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
          name: Vorv build ${{ env.SHORT_SHA }}
          body: |
            Vorv — local-first autonomous agent.

            **Install:** Settings → Apps → Special access → Install unknown apps → Chrome → Allow. Then tap the APK below.

            **First run:** Open Vorv → Files tab → grant a workspace folder → Setup tab → set LLM mode (cloud needs API key; local needs a one-time model download).

            **Shell tool setup (optional):** install Termux (F-Droid/GitHub), run `termux-setup-storage` once, and grant Vorv the "Run commands in Termux" permission.
          files: release/app-release.apk
          prerelease: true

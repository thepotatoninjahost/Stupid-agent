name: Build Vorv APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAS_KEYSTORE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_BASE64 != '' }}

jobs:
  test:
    name: Unit tests + sandbox self-test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        # actions/setup-java v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"


      - name: Python sandbox self-test
        run: python3 app/src/main/python/test_vorv_sandbox.py

      - name: Android lint
        run: ./gradlew lint --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Unit tests (JUnit + Robolectric)
        run: ./gradlew test --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

  build:
    name: Build debug + release APKs
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # release publishing is gated to trusted main runs
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        # actions/setup-java v6.2.0
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"


      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build APKs (debug always; release signed when keystore present)
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload debug APK artifact
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Vorv-debug-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK artifact
        if: env.HAS_KEYSTORE != 'true'
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Vorv-release-APK-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload signed release APK artifact
        if: env.HAS_KEYSTORE == 'true'
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Vorv-release-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: APK download instructions
        run: |
          echo '## APK downloads' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download Vorv-debug-APK from the Artifacts section of this run, extract the ZIP, then install the APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unsigned release APKs must be signed before installation. Artifacts expire after seven days.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish rolling CI release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          STALE_ASSET=app-release.apk
          if [ "$HAS_KEYSTORE" = true ]; then
            RELEASE_APK=app/build/outputs/apk/release/app-release.apk
            STALE_ASSET=app-release-unsigned.apk
          fi
          test -f "$DEBUG_APK" || { echo "debug APK missing"; exit 1; }
          test -f "$RELEASE_APK" || { echo "release APK missing"; exit 1; }
          NOTES=$(cat <<'EOF'
          Automated CI output of commit __SHA__.

          - `app-debug.apk`: debug-signed, debuggable. Sideloadable for testing (Settings → Apps → Special access → Install unknown apps → allow the browser, then tap the APK).
          EOF
          )
          NOTES=${NOTES/__SHA__/$SHORT_SHA}
          if [ "$HAS_KEYSTORE" = true ]; then
            NOTES="$NOTES

          - app-release.apk: signed with the private release key."
          else
            NOTES="$NOTES

          - app-release-unsigned.apk: UNSIGNED. It must be signed before installation. Use app-debug.apk for testing."
          fi
          gh release create "build-$SHORT_SHA" "$DEBUG_APK" "$RELEASE_APK" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Vorv build $SHORT_SHA" --notes "$NOTES" \
            || { gh release view "build-$SHORT_SHA" >/dev/null && \
                 gh release upload "build-$SHORT_SHA" "$DEBUG_APK" "$RELEASE_APK" --clobber; }
          if gh release view ci-latest >/dev/null 2>&1; then
            gh release upload ci-latest "$DEBUG_APK" "$RELEASE_APK" --clobber
            if gh release view ci-latest --json assets -q '.assets[].name' | grep -Fx "$STALE_ASSET"; then
              gh release delete-asset ci-latest "$STALE_ASSET" --yes
            fi
            gh release edit ci-latest --title "Vorv CI build $SHORT_SHA" --notes "$NOTES"
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/ci-latest" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create ci-latest "$DEBUG_APK" "$RELEASE_APK" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Vorv CI build $SHORT_SHA" --notes "$NOTES"
          fi
          for f in "$(basename "$DEBUG_APK")" "$(basename "$RELEASE_APK")"; do
            gh release view ci-latest --json assets \
              -q ".assets[].name" | grep -Fx "$f" \
              || { echo "MISSING on ci-latest release: $f"; exit 1; }
          done
          echo "rolling ci-latest release verified: both APKs present"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish:
    name: Publish signed release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout (for the short SHA)
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check release keystore is configured
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Private release signing is not configured. Install app-debug.apk from ci-latest for testing; app-release-unsigned.apk requires signing."

      - name: Download signed release APK
        if: env.HAS_KEYSTORE == 'true'
        continue-on-error: true
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Vorv-release-signed-APK
          path: release/

      - name: Recover signed APK from durable build release
        if: env.HAS_KEYSTORE == 'true'
        run: |
          if [ ! -s release/app-release.apk ]; then
            mkdir -p release
            gh release download "build-$(git rev-parse --short HEAD)" \
              --pattern app-release.apk --dir release --clobber
          fi
          test -s release/app-release.apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Compute short SHA and app version
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Publish Release
        if: env.HAS_KEYSTORE == 'true'
        # softprops/action-gh-release v3.0.3
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
          name: Vorv build ${{ env.SHORT_SHA }}
          body: |
            Vorv — local-first autonomous agent.

            **Install:** Settings → Apps → Special access → Install unknown apps → Chrome → Allow. Then tap the APK below.

            **First run:** Open Vorv → Files tab → grant a workspace folder → Setup tab → set LLM mode (cloud needs API key; local needs a one-time model download).

            **Shell tool setup (optional):** install Termux (F-Droid/GitHub), run `termux-setup-storage` once, and grant Vorv the "Run commands in Termux" permission.
          files: release/app-release.apk
          prerelease: true

name: Build Vorv APK

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vorv-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # Publish Release only on main — feature branches build-only (no release).
      # This lets me verify CI is green on a feature branch BEFORE merging.
      - name: Rename APK
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Vorv-debug.apk
          sha=$(git rev-parse --short HEAD)
          echo "APK_SHA=$sha" >> $GITHUB_ENV

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ env.APK_SHA }}
          name: Vorv build ${{ env.APK_SHA }}
          body: |
            Vorv — local-first autonomous agent.

            **Install:** Settings → Apps → Special access → Install unknown apps → Chrome → Allow. Then tap the APK below.

            **First run:** Open Vorv → Files tab → grant a workspace folder → Setup tab → set LLM mode (cloud needs API key).
          files: release/Vorv-debug.apk
          prerelease: true

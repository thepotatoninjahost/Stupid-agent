# Dependency wave 2026-11-09 (dependabot PRs #6/#7/#9/#10 + DEVELOPMENT.md
# roadmap step 1): Gradle 8.9 → 9.8.2, the version dependabot pinned in PR #9.
# The canonical services.gradle.org URL 307s to GitHub's release CDN, whose
# gradle assets have 504'd globally before (2026-11-08 outage, two CI runs
# died on it); the Tencent mirror serves a byte-identical archive — verified
# 2026-11-09: sha256(mirror gradle-9.8.2-bin.zip) == distributionSha256Sum
# below == dependabot's checksum for the official services.gradle.org asset.
# The wrapper enforces the hash, so a tampered mirror cannot build. Revert to
# services.gradle.org when its CDN is healthy; the hash pin stays either way.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.8.2-bin.zip
distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# 2026-11-08: the canonical services.gradle.org URL 307s to GitHub's release
# CDN, whose gradle-8.9/8.10 assets have been returning 504 globally for
# hours (verified from two networks; 8.7 resolves fine). Switched to the
# Tencent mirror, which serves a byte-identical archive — verified:
# sha256(gradle-8.9-bin.zip via mirror) == distributionSha256Sum below ==
# the official checksum served by services.gradle.org itself. The wrapper
# enforces that hash before using the archive, so a tampered mirror cannot
# build. Revert to services.gradle.org when its CDN heals; the hash pin
# stays either way.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip
distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

[versions]
# I-3 (code review, 2026-11) — verified dependency upgrades. Every version
# below was confirmed to EXIST on Google Maven / Maven Central (HEAD-checked)
# and to sit INSIDE the current build envelope (Gradle 8.9 / AGP 8.7.x /
# Kotlin 2.0.21 / compileSdk 35), so CI stays green by construction:
#   - agp 8.7.0 → 8.7.3 (bug-fix patch; same Gradle 8.9 minimum)
#   - ksp 2.0.21-1.0.27 → 2.0.21-1.0.28 (patch)
#   - okhttp 4.12.0 → 4.12.1 (security backport: refreshed certificate
#     blocklist for the compromised eMudhra intermediates — the same fix
#     OkHttp shipped in 5.5.1, backported to 4.x) + mockwebserver to match
#   - coroutines 1.9.0 → 1.10.2 (+ coroutinesTest)
#   - gson 2.11.0 → 2.13.2
#   - lifecycle 2.8.6 → 2.8.7 (patch)
#   - coreKtx 1.13.1 → 1.15.0 (compileSdk 35 ✓)
#   - datastore 1.1.1 → 1.1.7 (patch line)
#   - composeBom 2024.10.01 → 2025.04.01 (Compose 1.8.0, compileSdk 35 ✓;
#     NOT the 2025.08+/2026.x BOMs — Compose 1.9+ targets newer SDK levels)
#   - work 2.9.1 → 2.10.0 (compileSdk 35 ✓)
# The MAJOR jumps (AGP 9.5 + Gradle 9.6 + Kotlin 2.4 + KSP-for-2.4 +
# Compose BOM 2026.09 + OkHttp 5.5.1 + Room 2.7 + a Chaquopy release that
# supports them) are a separate coordinated migration — see the upgrade
# roadmap in DEVELOPMENT.md. "Never downgrade" includes not shipping a
# blind major bump that breaks the build.
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
chaquopy = "15.0.1"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2025.04.01"
navigationCompose = "2.8.3"
room = "2.6.1"
okhttp = "4.12.1"
coroutines = "1.10.2"
# Rhino 1.7.15.1 — the CVE-2025-66453 (toFixed DoS) fix release (audit M-3).
# The existing JsExecToolTest attack suite is the safety net for the upgrade.
rhino = "1.7.15.1"
# GenieX Android — Qualcomm's official first-party on-device Gen-AI runtime.
# Verified present on Maven Central at
# repo1.maven.org/maven2/com/qualcomm/qti/geniex-android/0.10.0/geniex-android-0.10.0.aar
# (89 MB, BSD-3-Clause). Bundles:
#   - libggml-hexagon.so + libggml-htp-v73/v75/v79/v81/v85.so  → Hexagon NPU backend
#   - libggml-opencl.so                                        → Adreno GPU backend
#   - libggml-cpu.so                                            → CPU fallback
#   - libQnnHtpV79/V81.so + libQnnHtpStubV79/V81.so            → QNN runtime for HTP
#   - libgeniex_plugin_llama_cpp.so + libgeniex_plugin_qairt.so → GenieX runtime plugins
#   - libllama.so, libllama-common.so                           → llama.cpp core
#   - libnpu_jni.so                                             → Java JNI bindings
# Hexagon HTP v81 = the S25's Snapdragon 8 Elite for Galaxy NPU version.
geniexAndroid = "0.10.0"
datastore = "1.1.7"
work = "2.10.0"
documentfile = "1.0.1"
# At-rest encryption for the stored API key (Android Keystore-backed master key).
securityCrypto = "1.1.0"
# Robust HTML parsing for web_fetch (replaces regex-based stripping).
jsoup = "1.23.2"
# JSON — used directly by the kernel, tools and LLM layer. Was previously a
# transitive dependency via Retrofit's converter; now declared explicitly
# because Retrofit was removed (audit L-5).
gson = "2.13.2"
# Test-only
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
coroutinesTest = "1.10.2"
mockwebserver = "4.12.1"
roomTesting = "2.6.1"


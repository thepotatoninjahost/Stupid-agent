[versions]
# Dependency wave 2026-11-09 — the coordinated major migration from the
# DEVELOPMENT.md roadmap (I-3), executed as one verified wave so the five
# open dependabot PRs land together instead of red:
#   PR #9  Gradle 8.9 → 9.8.2 (wrapper; mirror URL + official sha256)
#   PR #6  Kotlin 2.0.21 → 2.4.21, KSP 2.0.21-1.0.28 → 2.3.13,
#          coroutines 1.10.2 → 1.11.0 (+test)
#   PR #10 androidx: coreKtx 1.19.1, composeBom 2026.09.00,
#          navigationCompose 2.10.2, room 2.8.5 (+testing), datastore 1.3.0,
#          work 2.12.0, documentfile 1.1.0
#   PR #7  mockwebserver 4.12.1 → 5.5.1 (+ okhttp main dep to match;
#          okhttp 5.x is Kotlin-2.2-built, which is also why the old stack
#          could not even compile the test classpath)
#   PR #8  chaquopy 15.0.1 → 17.2.0 (already green on the old stack)
# Toolchain floor raised to match, per the AAR metadata errors that failed
# PR #10 on the old stack (navigation-compose 2.10.2 requires compileSdk 37;
# compose 1.12.1 requires AGP 9.1.0+): AGP 8.7.3 → 9.5.1, compileSdk 37,
# versionCode 36 / versionName 0.7.7. Every pin below was verified to exist
# (HEAD-checked on Google Maven / the mirrors this build actually uses) and
# the full 369-test suite + both APK assembles pass on this stack locally
# before the push. "Never downgrade" includes never shipping a blind major
# bump — this one ships verified.
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
chaquopy = "17.2.0"
coreKtx = "1.19.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
room = "2.8.5"
okhttp = "5.5.1"
coroutines = "1.11.0"
# Rhino 1.7.15.1 — the CVE-2025-66453 (toFixed DoS) fix release (audit M-3).
# The existing JsExecToolTest attack suite is the safety net for the upgrade.
rhino = "1.9.2"
# GenieX Android — Qualcomm's official first-party on-device Gen-AI runtime.
# Verified present on Maven Central at
# repo1.maven.org/maven2/com/qualcomm/qti/geniex-android/0.10.0/geniex-android-0.10.0.aar
# (89 MB, BSD-3-Clause). Bundles:
#   - libggml-hexagon.so + libggml-htp-v73/v75/v79/v81/v85.so  → Hexagon NPU backend
#   - libggml-opencl.so                                        → Adreno GPU backend
#   - libggml-cpu.so                                            → CPU fallback
#   - libQnnHtpV79/V81.so + libQnnHtpStubV79/V81.so            → QNN runtime for HTP
#   - libgeniex_plugin_llama_cpp.so + libgeniex_plugin_qairt.so → GenieX runtime plugins
#   - libllama.so, libllama-common.so                           → llama.cpp core
#   - libnpu_jni.so                                             → Java JNI bindings
# Hexagon HTP v81 = the S25's Snapdragon 8 Elite for Galaxy NPU version.
geniexAndroid = "0.10.0"
datastore = "1.3.0"
work = "2.12.0"
documentfile = "1.1.0"
# At-rest encryption for the stored API key (Android Keystore-backed master key).
securityCrypto = "1.1.0"
# Robust HTML parsing for web_fetch (replaces regex-based stripping).
jsoup = "1.23.2"
# JSON — used directly by the kernel, tools and LLM layer. Was previously a
# transitive dependency via Retrofit's converter; now declared explicitly
# because Retrofit was removed (audit L-5).
gson = "2.13.2"
# Test-only
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
coroutinesTest = "1.11.0"
mockwebserver = "5.5.1"
roomTesting = "2.8.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
rhino = { group = "org.mozilla", name = "rhino", version.ref = "rhino" }
geniex-android = { group = "com.qualcomm.qti", name = "geniex-android", version.ref = "geniexAndroid" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Test-only dependencies (not shipped in the APK)
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "roomTesting" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
